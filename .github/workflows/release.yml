name: Deploy Latest Release

on:
  push:
    branches:
      - main

# 1. FIXES THE PERMISSION ERROR: Grants permission to create releases
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest # Standard runner environment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. SETS UP GO COMPILER
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 3. BUILDS FOR ALMALINUX/CENTOS x64 (Linux AMD64)
      - name: Build Go Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o sysmonitor .

      - name: Generate Automatic Version Tag
        id: tagger
        run: |
          echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      # 4. FIXES DEPRECATION WARNING: Upgraded from @v2 to @v3
      - name: Create and Upload to Latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          make_latest: "true"
          files: |
            sysmonitor
